<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Day / Night Clock</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
      :root {
        --bg: #f7f2ea;
        --fg: #15120f;
        --muted: #756b61;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: "Libre Bodoni", serif;
        background: var(--bg);
        color: var(--fg);
      }

      body {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100svh;
        padding: 2rem;
        text-align: center;
        overflow: hidden;
        transition: background 800ms ease, color 800ms ease;
      }

      main {
        position: relative;
        z-index: 2;
        width: min(100%, 900px);
      }

      #label {
        margin: 0 0 1.5rem;
        font-size: clamp(3rem, 12vw, 8rem);
        font-weight: 500;
        letter-spacing: 0.08em;
        line-height: 0.95;
      }

      #time {
        margin: 0;
        font-size: clamp(5.5rem, 24vw, 16rem);
        font-weight: 700;
        line-height: 0.85;
        font-variant-numeric: tabular-nums;
      }

      #hint {
        margin-top: 2rem;
        font-size: clamp(1rem, 3vw, 1.5rem);
        color: var(--muted);
        letter-spacing: 0.04em;
      }

      body.tacet {
        --bg: #f7f2ea;
        --fg: #15120f;
        --muted: #756b61;
      }

      body.day {
        --bg: #8fd3ff;
        --fg: #083047;
        --muted: #24566c;
      }

      body.night {
        --bg: #000000;
        --fg: #ffffff;
        --muted: #d6d6d6;
      }

      body::before,
      body::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 800ms ease;
      }

      body.night::before {
        opacity: 1;
        background-image:
          radial-gradient(circle at 7% 12%, rgba(255,255,255,0.95) 0 1px, transparent 1.6px),
          radial-gradient(circle at 18% 31%, rgba(255,255,255,0.65) 0 1px, transparent 1.7px),
          radial-gradient(circle at 29% 8%, rgba(255,255,255,0.8) 0 1px, transparent 1.5px),
          radial-gradient(circle at 41% 22%, rgba(255,255,255,0.55) 0 1px, transparent 1.8px),
          radial-gradient(circle at 57% 11%, rgba(255,255,255,0.9) 0 1px, transparent 1.5px),
          radial-gradient(circle at 73% 28%, rgba(255,255,255,0.7) 0 1px, transparent 1.7px),
          radial-gradient(circle at 88% 16%, rgba(255,255,255,0.95) 0 1px, transparent 1.6px),
          radial-gradient(circle at 12% 63%, rgba(255,255,255,0.75) 0 1px, transparent 1.7px),
          radial-gradient(circle at 24% 84%, rgba(255,255,255,0.55) 0 1px, transparent 1.8px),
          radial-gradient(circle at 39% 71%, rgba(255,255,255,0.85) 0 1px, transparent 1.5px),
          radial-gradient(circle at 53% 88%, rgba(255,255,255,0.65) 0 1px, transparent 1.7px),
          radial-gradient(circle at 69% 67%, rgba(255,255,255,0.9) 0 1px, transparent 1.5px),
          radial-gradient(circle at 81% 79%, rgba(255,255,255,0.6) 0 1px, transparent 1.8px),
          radial-gradient(circle at 94% 58%, rgba(255,255,255,0.8) 0 1px, transparent 1.6px);
      }

      @media (max-width: 600px) {
        body {
          padding: 1.25rem;
        }

        #label {
          margin-bottom: 1rem;
        }

        #hint {
          margin-top: 1.5rem;
        }
      }
    </style>
  </head>

  <body class="tacet">
    <main>
      <h1 id="label">TACET</h1>
      <p id="time">1:00</p>
      <div id="hint">one-minute tacet, then day / night cycle</div>
    </main>

    <script>
      const labelEl = document.getElementById("label");
      const timeEl = document.getElementById("time");

      const startTime = Date.now();

      function formatCountdown(ms) {
        const totalSeconds = Math.ceil(ms / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;

        return `${minutes}:${String(seconds).padStart(2, "0")}`;
      }

      function formatCountUp(ms) {
        const totalSeconds = Math.floor(ms / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;

        return `${minutes}'${String(seconds).padStart(2, "0")}"`;
      }

      function updateClock() {
        const elapsed = Date.now() - startTime;

        const tacetMs = 1 * 60 * 1000;
        const loopMs = 4 * 60 * 1000;
        const sectionMs = 2 * 60 * 1000;

        let label;
        let displayTime;
        let className;

        if (elapsed < tacetMs) {
          label = "TACET";
          displayTime = formatCountdown(tacetMs - elapsed);
          className = "tacet";
        } else {
          const loopPosition = (elapsed - tacetMs) % loopMs;

          if (loopPosition < sectionMs) {
            label = "DAY";
            className = "day";
          } else {
            label = "NIGHT";
            className = "night";
          }

          displayTime = formatCountUp(loopPosition);
        }

        labelEl.textContent = label;
        timeEl.textContent = displayTime;
        document.body.className = className;
      }

      updateClock();
      setInterval(updateClock, 250);
    </script>
  </body>
</html>
